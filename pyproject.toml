[project]
name = "devopsdays-workshop"
version = "1.0.0"
description = "DevOpsDays Portland — GraphRAG over a microservices knowledge graph, in code and no-code"
requires-python = ">=3.10,<3.14"
dependencies = [
    "neo4j>=5.28",
    "langchain-neo4j>=0.4",
    "langchain-openai>=0.3",
    "langchain>=1.0",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
