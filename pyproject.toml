[project]
name = "devopsdays-workshop"
version = "1.0.0"
description = "DevOpsDays Portland — GraphRAG over a microservices knowledge graph, in code and no-code"
requires-python = ">=3.10,<3.14"
dependencies = [
    "neo4j>=5.28",
    # Retrieval: Neo4j's own GraphRAG package. Every retriever comes from here.
    "neo4j-graphrag>=1.18",
    # Agent only (step 07's create_agent) plus the chat model it takes.
    # Deliberately NOT langchain-neo4j — see steps/_common.py.
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
